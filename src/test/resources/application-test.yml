server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:itest_rect;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      connection-init-sql: "SET LOCK_TIMEOUT 30000"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

app:
  jwt-secret: test-secret-test-secret-test-secret-1234
  admin-username: admin
  admin-password: admin123
  seed:
    enabled: false
